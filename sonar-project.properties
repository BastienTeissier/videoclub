sonar.projectKey=videoclub
sonar.projectName=videoclub
sonar.host.url=http://localhost:9000
sonar.token=${SONAR_TOKEN}

sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/.turbo/**,**/coverage/**,**/migrations/**

sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info
sonar.typescript.tsconfigPaths=apps/api/tsconfig.json,apps/web/tsconfig.json

sonar.sourceEncoding=UTF-8
